name: Maquina Dinero Pasivo Nocturna

on:
  schedule:
    - cron: '0 8 * * *' # Alarma automática: Todos los días a las 3:00 AM hora de Colombia
  workflow_dispatch: # Activa un botón para que puedas probar el script manualmente cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Groq
        run: pip install groq

      - name: Ejecutar agentes de IA
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python script_nocturno.py

      - name: Publicar cambios en la web
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add index.html
          git commit -m "Actualización automática de IA" || exit 0
          git push
