name: TECHNOVA - Publicaciones automaticas

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install groq

      - name: Generar novedad con IA
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python script_nocturno.py

      - name: Guardar publicación
        run: |
          git config user.name "TECHNOVA AI"
          git config user.email "actions@github.com"
          git add publicaciones.json
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "TECHNOVA: nueva publicación"
            git push
          fi
